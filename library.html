<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Library | BookNest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg)
        }

        .standalone {
            max-width: 850px;
            margin: 0 auto
        }

        .page-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 17px
        }

        .page-nav a {
            color: var(--purple);
            font-size: 10px;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 7px;
            background: var(--soft)
        }

        .page-panel {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 23px;
            margin: 0 0 17px;
            box-shadow: var(--shadow)
        }

        .page-panel h1 {
            font: 800 24px Manrope;
            margin: 0 0 6px
        }

        .page-panel h2 {
            font: 800 16px Manrope;
            margin: 22px 0 10px
        }

        .page-panel>p,
        .intro {
            color: var(--muted);
            font-size: 11px;
            margin: 6px 0 17px
        }

        .rows {
            display: grid;
            gap: 10px
        }

        .book-row {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line)
        }

        .book-row:last-child {
            border-bottom: 0
        }

        .book-row-body {
            flex: 1;
            min-width: 0
        }

        .book-row h3 {
            font: 700 12px Manrope;
            margin: 0 0 3px
        }

        .muted {
            font-size: 10px;
            color: var(--muted);
            margin: 0 0 8px
        }

        .mini-cover {
            width: 57px;
            min-width: 57px;
            height: 76px;
            padding: 7px;
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            color: white;
            font: 700 9px Manrope;
            line-height: 1.2;
            box-shadow: inset 4px 0 #ffffff25
        }

        .cover-purple {
            background: linear-gradient(145deg, #9e83ed, #5541a8)
        }

        .cover-yellow {
            background: linear-gradient(145deg, #f4d67b, #c58b38);
            color: #45321a
        }

        .cover-blue {
            background: linear-gradient(145deg, #6ca4bc, #345e7e)
        }

        .cover-dark {
            background: linear-gradient(145deg, #51435c, #211b31)
        }

        .cover-orange {
            background: linear-gradient(145deg, #ee9c6a, #a8412e)
        }

        .cover-green {
            background: linear-gradient(145deg, #83b7a0, #316d61)
        }

        .cover-gold {
            background: linear-gradient(145deg, #e2cb7a, #967a27);
            color: #393019
        }

        .cover-indigo {
            background: linear-gradient(145deg, #8298dc, #354b8a)
        }

        .cover-brown {
            background: linear-gradient(145deg, #c69a79, #6d493a)
        }

        .row-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px
        }

        .action,
        .small-action,
        .remove-action {
            border: 0;
            border-radius: 7px;
            background: var(--purple);
            color: white;
            padding: 8px 10px;
            font-size: 10px;
            font-weight: 700
        }

        .small-action {
            padding: 5px 9px;
            background: var(--soft);
            color: var(--purple)
        }

        .remove-action {
            background: #fff0f0;
            color: #b33d51
        }

        .quantity {
            font-size: 11px;
            font-weight: 700
        }

        .disabled {
            opacity: .55
        }

        .empty {
            padding: 18px;
            border: 1px dashed #d9d1ef;
            border-radius: 10px;
            color: var(--muted);
            font-size: 11px;
            text-align: center
        }

        .status {
            font-size: 11px;
            color: #26835e;
            margin-top: 10px;
            min-height: 16px
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 12px
        }

        .summary-line.total {
            font-weight: 800;
            font-size: 14px
        }

        .page-form {
            display: grid;
            gap: 13px;
            max-width: 620px
        }

        .page-form label {
            display: grid;
            gap: 6px;
            font-size: 10px;
            font-weight: 700
        }

        .page-form input,
        .page-form select,
        .page-form textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 11px;
            background: var(--bg);
            color: var(--ink);
            font: 12px 'DM Sans', Arial
        }

        .page-form button {
            justify-self: start
        }

        .button {
            cursor: pointer
        }

        .profile-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--soft);
            color: var(--purple);
            display: grid;
            place-items: center;
            font: 800 25px Manrope;
            border: 3px solid var(--line);
            margin-bottom: 12px
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .profile-avatar img.hidden {
            display: none
        }

        .hidden {
            display: none !important
        }

        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 15px 0
        }

        .tabs button {
            border: 1px solid var(--line);
            background: var(--paper);
            color: var(--muted);
            border-radius: 8px;
            padding: 8px 11px;
            font-size: 10px
        }

        .tabs button.selected {
            background: var(--soft);
            border-color: #d5caff;
            color: var(--purple);
            font-weight: 800
        }

        .faq {
            border-bottom: 1px solid var(--line);
            padding: 12px 0
        }

        .faq summary {
            font-size: 11px;
            font-weight: 700;
            cursor: pointer
        }

        .faq p {
            font-size: 10px;
            color: var(--muted)
        }

        .placeholder-note {
            background: var(--soft);
            border-radius: 8px;
            padding: 12px;
            font-size: 10px;
            color: var(--ink)
        }

        @media(max-width:500px) {
            body {
                padding: 9px
            }

            .page-panel {
                padding: 16px
            }

            .book-row {
                align-items: flex-start
            }

            .row-actions {
                gap: 5px
            }

            .action {
                padding: 7px 8px
            }
        }

        body.embed-mode {
            padding: 0
        }

        .embed-mode .standalone {
            max-width: none;
            margin: 0
        }

        .embed-mode .page-nav {
            display: none
        }

        .embed-mode .page-panel {
            border-radius: 0;
            min-height: 100%;
            box-shadow: none
        }
    </style>
</head>

<body data-page="library">
    <main class="standalone">
        <nav class="page-nav" id="pageNav"></nav>
        <section class="page-panel">
            <h1>My library & reading challenge</h1>
            <div class="tabs"><button class="selected" data-filter="All">All</button><button
                    data-filter="Started">Started</button><button data-filter="In Progress">In Progress</button><button
                    data-filter="Completed">Completed</button></div>
            <div id="libraryBooks" class="rows"></div>
            <p id="libraryStatus" class="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="pages.js"></script>
</body>

</html>
