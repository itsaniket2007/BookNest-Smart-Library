<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                📖 <span>BookNest</span>
            </div>

            <nav>

                <a href="#" class="active">
                    🏠 <span>Home</span>
                </a>

                <a href="#">
                    ▦ <span>Browse Books</span>
                </a>

                <a href="#">
                    ◈ <span>Categories</span>
                </a>

                <a href="#">
                    📖 <span>Read Books</span>
                </a>

                <a href="#">
                    📕 <span>Borrow Books</span>
                </a>

                <a href="#">
                    🛒 <span>Buy Books</span>
                </a>

                <hr>

                <a href="#">
                    ◉ <span>My Dashboard</span>
                </a>

                <a href="#">
                    📚 <span>My Library</span>
                </a>

                <a href="#">
                    ⚙ <span>Settings</span>
                </a>

                <a href="#">
                    ❓ <span>Help & Support</span>
                </a>

            </nav>

        </aside>


        <!-- MAIN AREA -->
        <main>

            <!-- TOP NAVBAR -->
            <header class="topbar">

                <button class="menu">☰</button>

                <div class="search">
                    <input
                        type="text"
                        placeholder="Search books by title, author, category..."
                    >

                    <span>⌕</span>
                </div>

                <div class="profile">

                    <div class="avatar">
                        AK
                    </div>

                    <div>
                        <strong>Aniket Pathak</strong>
                        <small>Premium Member</small>
                    </div>

                    <span>⌄</span>

                </div>

            </header>

        </main>

    </div>

</html>
