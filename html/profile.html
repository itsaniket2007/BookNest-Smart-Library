<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6849e8">
  <title>My Profile | BookNest</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/common.js"></script>
</head>

<body class="page" data-page="profile">
  <main class="page-shell">
    <header class="page-header">
      <a class="back-link" href="index.html">← BookNest home</a>
      <nav class="page-nav" aria-label="BookNest pages">
        <a href="library.html">My Library</a>
        <a href="borrow.html">Borrow</a>
        <a href="cart.html">Cart &amp; Wishlist</a>
        <a href="profile.html" aria-current="page">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="feedback.html">Feedback</a>
      </nav>
      <button type="button" id="themeButton" class="btn btn-outline btn-sm" aria-pressed="false">☾ Dark mode</button>
    </header>
    <section class="page-panel" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Reader profile</h1>
      <p class="page-intro">Your details and photo are saved in this browser only. This is a local profile, not an account or a login.</p>
      <div class="profile-head">
        <div class="profile-avatar">
          <img id="profilePreview" class="hidden" alt="Your profile photo">
          <span id="profileInitials" aria-hidden="true">R</span>
        </div>
        <div id="profilePhotoActions" class="button-row">
          <button type="button" id="changePhotoButton" class="btn btn-soft btn-sm">Change photo</button>
          <button type="button" id="removePhotoButton" class="btn btn-danger btn-sm">Remove photo</button>
        </div>
      </div>
      <input id="photoInput" type="file" accept="image/*" class="hidden" aria-label="Choose profile image" tabindex="-1">

      <div id="profileView" class="hidden">
        <div id="profileDetails" class="profile-summary"></div>
        <div class="button-row"><button type="button" id="editProfileButton" class="btn btn-primary">Edit profile</button></div>
      </div>

      <form id="profileForm" class="form" novalidate>
        <div class="form-field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" required minlength="2" maxlength="60" autocomplete="given-name" aria-describedby="firstNameError">
          <p class="field-error" id="firstNameError"></p>
        </div>
        <div class="form-field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" required maxlength="60" autocomplete="family-name" aria-describedby="lastNameError">
          <p class="field-error" id="lastNameError"></p>
        </div>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="emailError">
          <p class="field-error" id="emailError"></p>
        </div>
        <div class="form-field">
          <label for="mobile">Mobile number (10 digits, optional)</label>
          <input id="mobile" name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel-national" aria-describedby="mobileError">
          <p class="field-error" id="mobileError"></p>
        </div>
        <div class="form-field">
          <label for="address">Address (optional)</label>
          <textarea id="address" name="address" rows="2" maxlength="300" autocomplete="street-address"></textarea>
        </div>
        <div class="form-field">
          <label for="category">Favourite book category</label>
          <select id="category" name="category" required aria-describedby="categoryError"><option value="">Choose a category</option><option>Fiction</option><option>Programming</option><option>Data Science</option><option>Data and Technology</option><option>Self Help</option><option>Business</option><option>History</option></select>
          <p class="field-error" id="categoryError"></p>
        </div>
        <div class="button-row">
          <button type="submit" class="btn btn-primary">Save profile</button>
          <button type="button" id="cancelProfileButton" class="btn btn-outline">Cancel</button>
        </div>
      </form>
      <p id="profileStatus" class="form-status" role="status"></p>
    </section>
  </main>
  <script src="../js/pages.js"></script>
</body>

</html>
