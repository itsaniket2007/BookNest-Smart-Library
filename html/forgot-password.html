<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6849e8">
  <title>Forgot password | BookNest</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
</head>
<body class="page" data-page="forgot-password">
  <main class="page-shell">
    <header class="page-header"><a class="back-link" href="login.html">← Back to log in</a><button type="button" id="themeButton" class="btn btn-outline btn-sm">☾ Dark mode</button></header>
    <section class="page-panel" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Reset your password</h1>
      <p class="page-intro">Enter your account email. If it exists, we will send a reset link that expires in one hour.</p>
      <form id="forgotPasswordForm" class="form" novalidate>
        <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="button-row"><button class="btn btn-primary" type="submit">Send reset link</button><a class="btn btn-outline" href="login.html">Log in</a></div>
      </form>
      <p id="forgotPasswordStatus" class="form-status" role="status"></p>
    </section>
  </main>
  <script src="../js/pages.js"></script>
</body>
</html>
