<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6849e8">
  <title>Choose a new password | BookNest</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
</head>
<body class="page" data-page="reset-password">
  <main class="page-shell">
    <header class="page-header"><a class="back-link" href="login.html">← Back to log in</a><button type="button" id="themeButton" class="btn btn-outline btn-sm">☾ Dark mode</button></header>
    <section class="page-panel" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Choose a new password</h1>
      <p class="page-intro">Use at least 8 characters with a letter and a number.</p>
      <form id="resetPasswordForm" class="form" novalidate>
        <div class="form-field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="form-field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="button-row"><button class="btn btn-primary" type="submit">Save new password</button></div>
      </form>
      <p id="resetPasswordStatus" class="form-status" role="status"></p>
    </section>
  </main>
  <script src="../js/pages.js"></script>
</body>
</html>
