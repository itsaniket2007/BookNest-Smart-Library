<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6849e8">
  <title>Create account | BookNest</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
</head>

<body class="page" data-page="register">
  <main class="page-shell">
    <header class="page-header">
      <a class="back-link" href="index.html">← BookNest home</a>
      <nav class="page-nav" aria-label="BookNest pages">
        <a href="login.html">Log in</a>
        <a href="register.html" aria-current="page">Register</a>
        <a href="profile.html">Profile</a>
      </nav>
      <button type="button" id="themeButton" class="btn btn-outline btn-sm" aria-pressed="false">☾ Dark mode</button>
    </header>
    <section class="page-panel" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Create a BookNest account</h1>
      <p class="page-intro">Register as a customer. Passwords are hashed with bcrypt. Duplicate emails are rejected. After registration you are signed in automatically.</p>
      <form id="registerForm" class="form" novalidate>
        <div class="form-field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" required minlength="2" maxlength="60" autocomplete="given-name">
        </div>
        <div class="form-field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" required maxlength="60" autocomplete="family-name">
        </div>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="mobile">Mobile number (10 digits, optional)</label>
          <input id="mobile" name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel-national">
        </div>
        <div class="form-field">
          <label for="password">Password (at least 8 characters, with a letter and a number)</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="button-row">
          <button type="submit" class="btn btn-primary">Register</button>
          <a class="btn btn-outline" href="login.html">Already have an account</a>
        </div>
      </form>
      <p id="registerStatus" class="form-status" role="status"></p>
    </section>
  </main>
  <script src="../js/pages.js"></script>
</body>

</html>
